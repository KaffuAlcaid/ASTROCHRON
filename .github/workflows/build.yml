name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'qml/**'
      - 'shaders/**'
      - 'assets/**'
      - 'third_party/**'
      - 'translations/**'
      - 'tools/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - 'package*.json'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'qml/**'
      - 'shaders/**'
      - 'assets/**'
      - 'third_party/**'
      - 'translations/**'
      - 'tools/**'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - 'package*.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag or branch, empty for the selected branch'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      QT_VERSION: '6.11.2'
      INNO_VERSION: '7.1.0'
      BUILD_REF: ${{ inputs.ref || github.ref }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install build tools
        run: python -m pip install cmake==4.4.3 ninja==1.13.2

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - name: Install resource tools
        run: npm ci --ignore-scripts

      - name: Build and collect application files
        run: ./tools/build.ps1 -QtRoot $env:QT_ROOT_DIR -Deploy -DeployDirectory .cache/stage/ASTROCHRON

      - name: Read application version
        id: version
        run: |
          $version = (Get-Item .cache/stage/ASTROCHRON/ASTROCHRON.exe).VersionInfo.ProductVersion
          if ($env:BUILD_REF.StartsWith('refs/tags/')) {
            $tag = $env:BUILD_REF.Substring('refs/tags/'.Length)
          } elseif ($env:BUILD_REF -match '^v\d+\.\d+\.\d+') {
            $tag = $env:BUILD_REF
          } else {
            $tag = ''
          }
          if ($tag -and $tag -cne "v$version") { throw "Tag $tag does not match application version v$version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare Inno Setup
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'inno'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $tag = 'is-' + $env:INNO_VERSION.Replace('.', '_')
          $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/PORTABLE=1', ('/DIR="' + $toolRoot + '"'))
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup preparation failed: $($process.ExitCode)" }

      - name: Create ZIP and installer
        run: ./tools/package-windows.ps1 -ApplicationDirectory .cache/stage/ASTROCHRON -OutputDirectory .cache/packages -InnoSetupRoot (Join-Path $env:RUNNER_TEMP 'inno')

      - name: Store Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ASTROCHRON-v${{ steps.version.outputs.version }}-windows-x64
          path: |
            .cache/packages/*.zip
            .cache/packages/*-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
